name: ci

# The checks a pull request must pass before it merges: the same prek hooks
# that run locally on commit (ruff, ty and pytest included), then the test
# suite with coverage and a dependency audit. Every hook in
# .pre-commit-config.yaml runs on a clean runner, so nothing is skipped.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Install the locked environment
        run: uv sync --locked

      - name: prek hooks
        run: uv run prek run --all-files --show-diff-on-failure

      - name: Tests
        run: uv run pytest

      - name: Dependency audit
        run: uv audit --locked
