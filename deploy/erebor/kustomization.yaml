apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# AD Feed Europe on erebor. Reconciled by square's
# clusters/erebor/flux/kustomization-adfeed.yaml from the `adfeed` GitRepository,
# path ./deploy/erebor.
resources:
  - namespace.yaml
  - sealedsecret-ghcr-pull.yaml # ghcr-pull: imagePullSecret, sealed for this namespace
  - pvc.yaml
  - deployment.yaml # api and worker in one pod, staged at 0 replicas
  - service.yaml
  - ingress.yaml
