# The SQLite database and the extracted PDF text. Scaleway block storage is
# ReadWriteOnce, which is why api and worker share one pod (deployment.yaml).
# The retain class keeps the volume when the PVC is removed.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: adfeed-data
  namespace: adfeed
  labels:
    app: adfeed
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: sbs-default-retain
  resources:
    requests:
      storage: 2Gi
