[project]
name = "easa-ad-api"
version = "0.1.0"
description = "Unofficial, free JSON API and Atom feeds over the airworthiness directive list that EASA publishes"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Rutger de Knijf", email = "rutger@deknijf.com" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.5.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "lxml>=6.1.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
easa-ad-api = "easa_ad_api.cli:main"

[build-system]
requires = ["uv_build>=0.13.7"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "prek>=0.5.10",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
    "ruff>=0.17.3",
    "ty>=0.0.97",
]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "N", "C4", "PT", "RET", "TID"]
ignore = ["RUF001"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket --allow-unix-socket --cov=easa_ad_api --cov-report=term-missing"

[tool.coverage.run]
branch = true
